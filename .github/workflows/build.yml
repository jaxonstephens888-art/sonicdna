name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git third_party/JUCE

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libcurl4-openssl-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDNA_BUILD_HOST_TEST=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target sdna_tests sonicdna SonicDNA_All

      - name: Core tests
        shell: bash
        run: |
          if [ -f build/Release/sdna_tests.exe ]; then build/Release/sdna_tests.exe; else ./build/sdna_tests; fi

      - name: Package
        shell: bash
        run: |
          set -x
          shopt -s nullglob
          mkdir -p dist
          ART=build/plugin/SonicDNA_artefacts/Release
          ls -la "$ART" "$ART"/* || true
          for d in Standalone VST3 AU; do
            if [ -d "$ART/$d" ]; then cp -R "$ART/$d/." dist/; fi
          done
          for cli in build/Release/sonicdna.exe build/sonicdna.exe build/sonicdna; do
            if [ -f "$cli" ]; then cp "$cli" dist/; break; fi
          done
          rm -f dist/*.pdb dist/*.lib dist/*.exp
          cp README.md dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SONIC-DNA-${{ matrix.name }}
          path: dist
