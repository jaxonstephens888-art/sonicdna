name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git third_party/JUCE

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libcurl4-openssl-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          # macOS: Universal binary (Apple Silicon + Intel), runs on macOS 11+
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDNA_BUILD_HOST_TEST=OFF $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target sdna_tests sonicdna SonicDNA_All

      - name: Core tests
        shell: bash
        run: |
          if [ -f build/Release/sdna_tests.exe ]; then build/Release/sdna_tests.exe; else ./build/sdna_tests; fi

      - name: Package
        shell: bash
        run: |
          set -x
          shopt -s nullglob
          mkdir -p dist
          ART=build/plugin/SonicDNA_artefacts/Release
          ls -la "$ART" "$ART"/* || true
          for d in Standalone VST3 AU; do
            if [ -d "$ART/$d" ]; then cp -R "$ART/$d/." dist/; fi
          done
          for cli in build/Release/sonicdna.exe build/sonicdna.exe build/sonicdna; do
            if [ -f "$cli" ]; then cp "$cli" dist/; break; fi
          done
          rm -f dist/*.pdb dist/*.lib dist/*.exp
          cp README.md dist/
          cp packaging/INSTALL-${{ runner.os }}.txt dist/ 2>/dev/null || true
          ls -la dist

      # GitHub artifact zips drop file permissions, which makes macOS report the app as "damaged".
      # So: sign (ad-hoc) and ship macOS inside a .dmg, Linux inside a .tar.gz, which both keep permissions.
      - name: Sign and build disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -ex
          cd dist
          for b in "SONIC DNA.app" "SONIC DNA.vst3" "SONIC DNA.component"; do
            if [ -e "$b" ]; then
              xattr -cr "$b"
              codesign --force --deep --sign - --timestamp=none "$b"
              codesign --verify --deep --strict --verbose=2 "$b"
            fi
          done
          lipo -info "SONIC DNA.app/Contents/MacOS/SONIC DNA"
          chmod +x sonicdna "SONIC DNA.app/Contents/MacOS/SONIC DNA"
          cd ..
          hdiutil create -volname "SONIC DNA" -srcfolder dist -ov -format UDZO SONIC-DNA-macOS.dmg
          # Verify the image: mount it and check the app is intact, executable and validly signed.
          MNT=$(mktemp -d)
          hdiutil attach SONIC-DNA-macOS.dmg -nobrowse -readonly -mountpoint "$MNT"
          test -x "$MNT/SONIC DNA.app/Contents/MacOS/SONIC DNA"
          codesign --verify --deep --strict "$MNT/SONIC DNA.app"
          "$MNT/sonicdna" analyze "Burial" | head -3
          hdiutil detach "$MNT"
          mkdir -p upload && mv SONIC-DNA-macOS.dmg upload/

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p upload
          tar -czf upload/SONIC-DNA-Linux.tar.gz -C dist .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p upload
          cp -R dist/. upload/

      - uses: actions/upload-artifact@v4
        with:
          name: SONIC-DNA-${{ matrix.name }}
          path: upload
